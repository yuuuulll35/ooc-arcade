<title>OOC 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 한 줄 리스트형 아카이브. 헤더 → 필터 바 → 행(번호·제목·분류·날짜·→) */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --fg:#1b1d22; --muted:#6b6f78; --line:#e3e3de;
  --accent:#3b4cc0; --accent-soft:#e8eafb; --pair:#b04a6f; --pair-soft:#f8e7ee;
  --f-display:"Hahmlet","Gowun Batang",serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151a; --surface:#1b1d23; --fg:#ececef; --muted:#9a9ea8; --line:#2b2e36;
  --accent:#9aa6ff; --accent-soft:#252a4a; --pair:#f08fb2; --pair-soft:#3a2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1b1d23; --fg:#ececef; --muted:#9a9ea8; --line:#2b2e36;
  --accent:#9aa6ff; --accent-soft:#252a4a; --pair:#f08fb2; --pair-soft:#3a2230; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 72px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:32px}

header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:52ch}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-block:1px solid var(--line);padding-block:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:5px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.search input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{flex:1 1 200px;max-width:260px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:2.4em 1fr auto auto;gap:4px 16px;align-items:center;
  padding:18px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;border-radius:6px;
  transition:background .15s}
.row:hover{background:var(--surface)}
.num{font-family:var(--f-mono);font-size:13px;color:var(--muted);align-self:start;padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.35}
.desc{color:var(--muted);font-size:14px}
.tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.ooc{color:var(--accent);background:var(--accent-soft)}
.tag.pair{color:var(--pair);background:var(--pair-soft)}
.date{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.arrow{transition:transform .15s}
.row:hover .arrow{transform:translateX(3px);color:var(--fg)}
.empty{color:var(--muted);padding:32px 4px;text-align:center}

footer{font-size:13px;color:var(--muted)}

@media (max-width:560px){
  .row{grid-template-columns:2em 1fr auto;grid-template-areas:"n b b" "n t d"}
  .num{grid-area:n}.body{grid-area:b}.tag{grid-area:t;justify-self:start}.date{grid-area:d}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){.row,.arrow{transition:none}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Archive · 2026</span>
    <h1>OOC 아케이드</h1>
  </header>

  <div class="bar">
    <div class="chips" role="group" aria-label="분류">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체 <b></b></button>
      <button class="chip" id="f-ooc" data-f="ooc" aria-pressed="false">OOC <b></b></button>
      <button class="chip" id="f-pair" data-f="pair" aria-pressed="false">페어틀 <b></b></button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="제목 검색" aria-label="제목 검색"></label>
  </div>

  <ol class="list" id="list"></ol>

</div>

<script>
const items = [
  {t:"마음 달이는 다락방", d:"마녀 고양이와 함께 NPC의 마음을 사랑의 묘약으로 달이는 게임", c:"ooc", date:"2026.11.08", url:"https://claude.ai/artifact/JxTo4UV4E5yf2H5hHj2tzV"},
  {t:"마녀의 속마음 실험실", d:"캐릭터의 속마음을 실험실에서 분석해 보는 OOC", c:"ooc", date:"2026.11.04", url:"https://claude.ai/artifact/GDQ91GsNaJSmRvwnhTx5YK"},
  {t:"LOVE DIVE", d:"두 사람의 관계에 깊이 뛰어드는 페어틀", c:"pair", date:"2026.10.28", url:"https://claude.ai/artifact/LZoQ6Yq86kzuxvaHmKtBre"},
  {t:"Sleeve — 페어 플레이리스트", d:"페어를 노래로 엮는 플레이리스트 페어틀", c:"pair", date:"2026.10.17", url:"https://claude.ai/artifact/5WmhEvDgaVKaKxm7NDUon9"},
  {t:"스카우트 스튜디오", d:"캐릭터를 스카우트 프로필로 정리하는 OOC", c:"ooc", date:"2026.10.15", url:"https://claude.ai/artifact/6jgAG78h5UoQ36fDphpMh3"},
  {t:"연선 沿線 · Crossroads", d:"두 사람이 엇갈리고 만나는 노선 페어틀", c:"pair", date:"2026.10.13", url:"https://claude.ai/artifact/GRz3gK2irDd89jnJZTaKW9"},
  {t:"MIND ARCHIVE · 뇌구조 열람실", d:"캐릭터의 뇌구조를 열람하는 OOC", c:"ooc", date:"2026.10.13", url:"https://claude.ai/artifact/5EGqJqWNSFiREwW9KZXKw5"},
];
const label = {ooc:"OOC", pair:"페어틀"};
let filter = "all";
const $list = document.getElementById("list"), $q = document.getElementById("q");

document.querySelectorAll(".chip").forEach(b=>{
  const f=b.dataset.f;
  b.querySelector("b").textContent = f==="all" ? items.length : items.filter(i=>i.c===f).length;
  b.addEventListener("click",()=>{
    filter=f;
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b));
    render();
  });
});
$q.addEventListener("input",render);

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const q=$q.value.trim().toLowerCase();
  const shown=items.filter(i=>(filter==="all"||i.c===filter)&&(!q||(i.t+i.d).toLowerCase().includes(q)));
  $list.innerHTML = shown.length ? shown.map(i=>`
    <li><a class="row" href="${i.url}" target="_blank" rel="noopener">
      <span class="num">${String(items.length-items.indexOf(i)).padStart(2,"0")}</span>
      <span class="body"><span class="name">${esc(i.t)}</span><span class="desc">${esc(i.d)}</span></span>
      <span class="tag ${i.c}">${label[i.c]}</span>
      <span class="date">${i.date}<span class="arrow" aria-hidden="true">→</span></span>
    </a></li>`).join("") : `<li class="empty">찾는 작품이 없어요.</li>`;
}
render();
</script>
