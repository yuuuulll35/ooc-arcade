<title>OOC 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: 따뜻한 메모장. 흰 헤더 바(형광펜 제목) → 웜 페이퍼 바탕 위 필터 패널 → 흰 카드 그리드 */
:root{
  --bg:#f7f6f1; --surface:#ffffff; --fg:#1d1d1b; --muted:#8a877e; --line:#e6e3da;
  --mark:#ffe14d; --tag-ooc:#fff3b8; --tag-pair:#ffe0e6; --tag-tool:#dcefff; --tag-fg:#4a4636;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
:root{color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top .in{box-sizing:content-box;max-width:1000px;margin:0 auto;padding-block:32px 0;display:flex;align-items:center;gap:8px}
.top .em{font-family:var(--f-emoji);font-size:22px;line-height:1}
h1{margin:0;font-family:"Fredoka","Jua",var(--f-body);font-weight:600;font-size:22px;letter-spacing:.02em;line-height:1.25}
h1 mark{background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit;padding:0 3px}

.handle{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
.handle:hover{color:var(--fg)}
.handle:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
main{box-sizing:content-box;max-width:1000px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:24px}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:6px 16px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:500;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.chip:focus-visible,.search input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.search{flex:1 1 200px;max-width:280px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.search input::placeholder{color:var(--muted)}

.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:18px;gap:14px;color:inherit;text-decoration:none;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px -14px rgb(90 72 30 / .28)}
.card:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.glyph{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--bg);
  font-family:var(--f-emoji);font-size:30px;line-height:1;transition:background .35s}
.card:hover .glyph{background:var(--tint)}
.card:hover .glyph{animation:hop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes hop{0%{transform:none}40%{transform:translateY(-5px) scale(1.06)}100%{transform:none}}
.card.ooc{--tint:var(--tag-ooc)}
.card.pair{--tint:var(--tag-pair)}
.card.tool{--tint:var(--tag-tool)}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;color:var(--tag-fg)}
.tag.ooc{background:var(--tag-ooc)}
.tag.pair{background:var(--tag-pair)}
.tag.tool{background:var(--tag-tool)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.name{font-weight:700;font-size:16px;line-height:1.4;text-wrap:balance}
.desc{color:var(--muted);font-size:13.5px;line-height:1.55}
.tag .n{margin-left:6px;padding-left:6px;border-left:1px solid rgb(74 70 54 / .25);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 4px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px}

@media (max-width:560px){
  h1{font-size:20px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:14px;gap:10px}
  .glyph{width:46px;height:46px;font-size:25px;border-radius:12px}
  .name{font-size:14.5px}
  .desc{display:none}
  .search{max-width:none}
}
/* soft motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.list li{animation:rise .45s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i) * 50ms)}
.chip{transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:hover{border-color:var(--fg)}
.chip:active{transform:scale(.95)}
.search input{transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--line)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card:hover,.card:hover .glyph{transform:none}}
</style>

<header class="top pad">
  <div class="in">
    <span class="em" aria-hidden="true">🐣</span>
    <h1><mark>OOC ARCADE</mark></h1>
    <a class="handle" href="https://x.com/gimyunseul92364" target="_blank" rel="noopener">@gimyunseul92364</a>
  </div>
</header>

<main class="pad">
  <div class="bar">
    <div class="chips" role="group" aria-label="분류">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체 <b></b></button>
      <button class="chip" id="f-ooc" data-f="ooc" aria-pressed="false">OOC <b></b></button>
      <button class="chip" id="f-pair" data-f="pair" aria-pressed="false">페어틀 <b></b></button>
      <button class="chip" id="f-tool" data-f="tool" aria-pressed="false">도구함 <b></b></button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="제목 검색" aria-label="제목 검색"></label>
  </div>

  <ol class="list" id="list"></ol>
</main>

<script>
const items = [
  {t:"LOVE POTION MAKER", g:"🐈‍⬛", d:"NPC의 호감도를 해부해보자!", c:"ooc", n:3, url:"https://yuuuulll35.github.io/heartbrew-lab/"},
  {t:"LOVE DIVE!", g:"💘", d:"두 사람의 사랑은 얼마나 무거울까?", c:"ooc", n:1, url:"https://yuuuulll35.github.io/love-dive/"},
  {t:"SLEEVE", g:"🎧", d:"페어를 노래로 엮는 플레이리스트 페어틀", c:"pair", url:"https://claude.ai/artifact/5WmhEvDgaVKaKxm7NDUon9"},
  {t:"MIND ARCHIVE", g:"🧠", d:"두 사람의 뇌구조를 확인하는 열람실", c:"ooc", n:3, url:"https://yuuuulll35.github.io/mind-archive/"},
  {t:"RELATION ANATOMY", g:"🔬", d:"캐릭터의 관계 역학 판정 페어틀", c:"ooc", n:8, url:"https://yuuuulll35.github.io/relation-anatomy/"},
  {t:"PAIR LOG MAKER", g:"💾", d:"레트로 윈도우 UI 스타일의 카드 메이커", c:"pair", url:"https://yuuuulll35.github.io/pair-log-maker/"},
  {t:"MAIN TWEET MAKER", g:"🖼️", d:"프로필·계정 소개용 메인 트윗 이미지 메이커", c:"pair", url:"https://yuuuulll35.github.io/shape-ui/"},
  {t:"BLANK", g:"📝", d:"대화 로그를 HTML 변환 편집기", c:"tool", url:"https://yuuuulll35.github.io/blank/"},
];
const label = {ooc:"OOC", pair:"페어틀", tool:"도구함"};
let filter = "all";
const $list = document.getElementById("list"), $q = document.getElementById("q");

document.querySelectorAll(".chip").forEach(b=>{
  const f=b.dataset.f;
  b.querySelector("b").textContent = f==="all" ? items.length : items.filter(i=>i.c===f).length;
  b.addEventListener("click",()=>{
    filter=f;
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b));
    render();
  });
});
$q.addEventListener("input",render);

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const q=$q.value.trim().toLowerCase();
  const shown=items.filter(i=>(filter==="all"||i.c===filter)&&(!q||(i.t+i.d).toLowerCase().includes(q)));
  $list.innerHTML = shown.length ? shown.map((i,n)=>`
    <li style="--i:${n}"><a class="card ${i.c}" href="${i.url}" target="_blank" rel="noopener">
      <span class="head">
        <span class="glyph" aria-hidden="true">${i.g}</span>
        <span class="tag ${i.c}">${label[i.c]}${i.n ? `<span class="n">${i.n}개</span>` : ""}</span>
      </span>
      <span class="body">
        <span class="name">${esc(i.t)}</span>
        <span class="desc">${esc(i.d)}</span>
      </span>
    </a></li>`).join("") : `<li class="empty">찾는 작품이 없어요.</li>`;
}
render();
</script>
