<title>OOC 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 한 줄 리스트형 아카이브. 헤더 → 필터 바 → 행(번호·제목·분류·날짜·→) */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --fg:#1b1d22; --muted:#6b6f78; --line:#e3e3de;
  --accent:#3b4cc0; --accent-soft:#e8eafb; --pair:#b04a6f; --pair-soft:#f8e7ee;
  --f-display:"Hahmlet","Gowun Batang",serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151a; --surface:#1b1d23; --fg:#ececef; --muted:#9a9ea8; --line:#2b2e36;
  --accent:#9aa6ff; --accent-soft:#252a4a; --pair:#f08fb2; --pair-soft:#3a2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1b1d23; --fg:#ececef; --muted:#9a9ea8; --line:#2b2e36;
  --accent:#9aa6ff; --accent-soft:#252a4a; --pair:#f08fb2; --pair-soft:#3a2230; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 72px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:32px}

header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:52ch}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-block:1px solid var(--line);padding-block:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:5px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.search input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{flex:1 1 200px;max-width:260px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px}

.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px rgb(0 0 0 / .25)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cover{position:relative;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff}
.glyph{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:60px;line-height:1;
  filter:drop-shadow(0 6px 8px rgb(0 0 0 / .12));transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.card:hover .glyph{transform:scale(1.12) rotate(-6deg)}
.cover .tag{position:absolute;top:12px;left:12px;background:rgb(255 255 255 / .85);color:#4a4458}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgb(255 255 255 / .55),transparent 45%);pointer-events:none}
.body{min-width:0;display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px;flex:1}
.name{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.35;text-wrap:balance}
.desc{color:var(--muted);font-size:13.5px;line-height:1.5}
.tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.empty{grid-column:1/-1;color:var(--muted);padding:32px 4px;text-align:center}

@media (max-width:560px){
  .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .body{padding:12px}
  .name{font-size:15px}
  .desc{display:none}
  .glyph{font-size:46px}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){.card,.glyph{transition:none}.card:hover,.card:hover .glyph{transform:none}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Archive · 2026</span>
    <h1>OOC 아케이드</h1>
  </header>

  <div class="bar">
    <div class="chips" role="group" aria-label="분류">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체 <b></b></button>
      <button class="chip" id="f-ooc" data-f="ooc" aria-pressed="false">OOC <b></b></button>
      <button class="chip" id="f-pair" data-f="pair" aria-pressed="false">페어틀 <b></b></button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="제목 검색" aria-label="제목 검색"></label>
  </div>

  <ol class="list" id="list"></ol>

</div>

<script>
const items = [
  {t:"마음 달이는 다락방", g:"🐈‍⬛", col:["#e4dcff","#c9b8ff"], d:"마녀 고양이와 함께 NPC의 마음을 사랑의 묘약으로 달이는 게임", c:"ooc", date:"2026.11.08", url:"https://claude.ai/artifact/JxTo4UV4E5yf2H5hHj2tzV"},
  {t:"마녀의 속마음 실험실", g:"🧪", col:["#d6f5e6","#a9e4c8"], d:"캐릭터의 속마음을 실험실에서 분석해 보는 OOC", c:"ooc", date:"2026.11.04", url:"https://claude.ai/artifact/GDQ91GsNaJSmRvwnhTx5YK"},
  {t:"LOVE DIVE", g:"💘", col:["#ffe0ea","#ffb8cf"], d:"두 사람의 관계에 깊이 뛰어드는 페어틀", c:"pair", date:"2026.10.28", url:"https://claude.ai/artifact/LZoQ6Yq86kzuxvaHmKtBre"},
  {t:"Sleeve — 페어 플레이리스트", g:"🎧", col:["#dcecff","#b4d4fb"], d:"페어를 노래로 엮는 플레이리스트 페어틀", c:"pair", date:"2026.10.17", url:"https://claude.ai/artifact/5WmhEvDgaVKaKxm7NDUon9"},
  {t:"스카우트 스튜디오", g:"🌟", col:["#fff1cf","#ffd88f"], d:"캐릭터를 스카우트 프로필로 정리하는 OOC", c:"ooc", date:"2026.10.15", url:"https://claude.ai/artifact/6jgAG78h5UoQ36fDphpMh3"},
  {t:"연선 沿線 · Crossroads", g:"🚃", col:["#d9f1fb","#a7dcf2"], d:"두 사람이 엇갈리고 만나는 노선 페어틀", c:"pair", date:"2026.10.13", url:"https://claude.ai/artifact/GRz3gK2irDd89jnJZTaKW9"},
  {t:"MIND ARCHIVE · 뇌구조 열람실", g:"🧠", col:["#f6e2f7","#e6bfe9"], d:"캐릭터의 뇌구조를 열람하는 OOC", c:"ooc", date:"2026.10.13", url:"https://claude.ai/artifact/5EGqJqWNSFiREwW9KZXKw5"},
];
const label = {ooc:"OOC", pair:"페어틀"};
let filter = "all";
const $list = document.getElementById("list"), $q = document.getElementById("q");

document.querySelectorAll(".chip").forEach(b=>{
  const f=b.dataset.f;
  b.querySelector("b").textContent = f==="all" ? items.length : items.filter(i=>i.c===f).length;
  b.addEventListener("click",()=>{
    filter=f;
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b));
    render();
  });
});
$q.addEventListener("input",render);

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  const q=$q.value.trim().toLowerCase();
  const shown=items.filter(i=>(filter==="all"||i.c===filter)&&(!q||(i.t+i.d).toLowerCase().includes(q)));
  $list.innerHTML = shown.length ? shown.map(i=>`
    <li><a class="card" href="${i.url}" target="_blank" rel="noopener">
      <span class="cover" style="--c1:${i.col[0]};--c2:${i.col[1]}">
        <span class="tag">${label[i.c]}</span>
        <span class="glyph" aria-hidden="true">${esc(i.g)}</span>
      </span>
      <span class="body">
        <span class="name">${esc(i.t)}</span>
        <span class="desc">${esc(i.d)}</span>
      </span>
    </a></li>`).join("") : `<li class="empty">찾는 작품이 없어요.</li>`;
}
render();
</script>
